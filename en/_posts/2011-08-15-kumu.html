<p><a href="https://en.wikipedia.org/wiki/Kumu_(museum)">Kumu Art Museum</a> (Estonian: Kumu Kunstimuuseum) is an art museum in Tallinn. It is the largest museum in the Baltic region and one of the largest museums in Northern Europe.</p>
