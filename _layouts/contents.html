<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/assets/bootstrap.5.3.8.min.css">
<link rel="stylesheet" href="/main.css">
<link rel="icon" type="image/png" href="/apple-touch-icon-16x16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
<title>{{ page.title }}</title>

<meta name="author" content="Stas Raskumandrin">
<meta name="copyright" content="Stas Raskumandrin">

<style>
body {
    background: #fff;
    color: #222;
}

/* Compatibility for the English contents page, which still uses the old table. */
div#header {
    position: relative;
    margin: 16px;
}

div#header span.rightfloat {
    position: absolute;
    top: 8px;
    right: 0;
    width: 300px;
    text-align: right;
}

div#header span.rightfloat,
div#header span.rightfloat a {
    color: silver;
}

table#content {
    width: 100%;
    border-collapse: collapse;
    font: normal 10pt Arial;
}

table#content th {
    padding: 6px 16px;
    background: #f0f0f0;
    font: normal 1.3em 'Times New Roman';
    text-align: left;
}

table#content td {
    vertical-align: top;
    padding: 6px 16px;
}

table#content td + td {
    border-left: dotted 1px silver;
}

table#content td.year {
    text-align: center;
    letter-spacing: .5em;
    font-weight: bolder;
    color: #666;
}

table#content dd {
    margin-bottom: 1em;
}

table#content dt {
    color: #999;
}

table#content dd a {
    color: #444;
}

.contents-page {
    padding-top: 1.75rem;
    padding-bottom: 3rem;
}

.contents-header {
    margin-bottom: 2rem;
}

.contents-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
}

.contents-header h1 {
    margin-bottom: .75rem;
    font-size: 2rem;
    font-weight: 300;
    color: #444;
}

.contents-header p {
    margin-bottom: .75rem;
}

.contents-home {
    flex-shrink: 0;
    font-size: .95rem;
}

.contents-home,
.contents-telegram a {
    color: gray;
    text-decoration: none;
}

.contents-home:hover,
.contents-telegram a:hover {
    color: #0ebfe9;
    text-decoration: underline;
}

.contents-section {
    margin-top: 2rem;
}

.contents-section h2 {
    margin-bottom: 1rem;
    font-size: 1.35rem;
    font-weight: 300;
    color: #222;
}

.contents-section h3 {
    margin-top: 1.25rem;
    margin-bottom: .5rem;
    font-size: 1.1rem;
    font-weight: 300;
    color: #222;
}

.contents-sections h3 {
    margin-top: 0;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.3;
}

.contents-sections p {
    margin-bottom: 0;
    color: #666;
    font-size: .88rem;
    line-height: 1.45;
}

.contents-latest li,
.archive-post {
    margin-bottom: .55rem;
    line-height: 1.45;
}

.contents-latest time,
.archive-post time {
    display: inline-block;
    min-width: 6.2rem;
    color: gray;
}

.contents-link-list {
    column-gap: .85rem;
    row-gap: .15rem;
    margin-bottom: 1rem;
}

.contents-link-list .nav-link {
    padding: .1rem 0;
    color: #444;
    text-decoration: underline;
}

.contents-link-list .nav-link:hover {
    color: #0ebfe9;
}

.archive-year {
    border-top: 1px solid #e5e5e5;
}

.archive-year summary {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: .75rem 0;
    cursor: pointer;
}

.archive-year summary span {
    font-size: 1.25rem;
    color: #444;
}

.archive-year summary em {
    color: gray;
    font-style: normal;
    white-space: nowrap;
}

.archive-year ol {
    padding-bottom: .75rem;
}

.archive-post {
    display: grid;
    grid-template-columns: 5.5rem minmax(0, 1fr);
    gap: .25rem .75rem;
}

.archive-post span {
    grid-column: 2;
    color: gray;
    font-size: .85rem;
}

@media (max-width: 767.98px) {
    .contents-page {
        padding-top: 1.25rem;
    }

    .contents-title {
        align-items: flex-start;
    }

    .contents-home {
        max-width: 7rem;
        text-align: right;
    }

    .contents-latest time,
    .archive-post time {
        display: block;
        min-width: 0;
    }

    .archive-post {
        display: block;
        margin-bottom: .8rem;
    }

    .archive-post span {
        display: block;
    }

    .archive-year summary {
        align-items: flex-start;
        flex-direction: column;
        gap: .1rem;
    }
}
</style>
</head>
<body>
<div class="container-wrapper"><div class="container">
{{ content }}
</div></div>
<script src="/assets/bootstrap.5.3.8.bundle.min.js"></script>
</body>
</html>
